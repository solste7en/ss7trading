[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "E701",   # multi-statement colon — used deliberately for compact dispatch tables
    "E702",   # multi-statement semicolon — used deliberately for compact filter builders
    "E741",   # ambiguous variable names (l, O, I) — common in finance code
    "SIM102", # nested if vs combined — sometimes clearer with nesting
    "SIM108", # ternary instead of if/else — readability preference
]

[tool.ruff.lint.per-file-ignores]
"sync_trades.py" = ["B007", "E402"]
"db.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["blueprints", "services"]

[tool.coverage.run]
source = ["."]
omit = [
    "venv/*",
    ".venv/*",
    "tests/*",
    "scripts/*",
    ".claude/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
