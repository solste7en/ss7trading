name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --exclude venv --exclude .claude

  test:
    runs-on: ubuntu-latest
    env:
      SCHWAB_APP_KEY: "test-key"
      SCHWAB_APP_SECRET: "test-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=20
